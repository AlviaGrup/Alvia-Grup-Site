<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portofoliu</title>
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; }
  .gallery {
    display: flex;
    gap: 20px;               /* space between pictures */
    height: 470px;           /* gallery height */
    padding: 10px 0;
  }
  .gallery .item {
    flex: 1;                 /* narrow picture */
    min-width: 0;
    overflow: hidden;
    border-radius: 40px;     /* rounded "pill" shape */
    background: #eee;        /* grey shows if a picture can't load */
    cursor: pointer;
    transition: flex 0.8s cubic-bezier(0.25, 0.8, 0.25, 1), border-radius 0.8s;
  }
  .gallery .item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .gallery .item.active {
    flex: 8;                 /* wide picture – bigger number = wider */
    border-radius: 20px;
  }
  @media (max-width: 600px) {          /* phones */
    .gallery { height: 300px; gap: 8px; }
    .gallery .item { border-radius: 20px; }
    .gallery .item.active { flex: 5; }
  }
</style>
</head>
<body>
<div class="gallery" id="gallery">
  <!-- one line per picture -->
  <div class="item"><img src="portofolio/1.jpg" alt="Portofoliu 1"></div>
  <div class="item active"><img src="portofolio/2.jpg" alt="Portofoliu 2"></div>
  <div class="item"><img src="portofolio/3.jpg" alt="Portofoliu 3"></div>
  <div class="item"><img src="portofolio/4.jpg" alt="Portofoliu 4"></div>
  <div class="item"><img src="portofolio/5.jpg" alt="Portofoliu 5"></div>
  <div class="item"><img src="portofolio/6.jpg" alt="Portofoliu 6"></div>
  <div class="item"><img src="portofolio/7.jpg" alt="Portofoliu 7"></div>
  <div class="item"><img src="portofolio/8.jpg" alt="Portofoliu 8"></div>
  <div class="item"><img src="portofolio/9.jpg" alt="Portofoliu 9"></div>
  <div class="item"><img src="portofolio/10.jpg" alt="Portofoliu 10"></div>
  <div class="item"><img src="portofolio/11.jpg" alt="Portofoliu 11"></div>
  <div class="item"><img src="portofolio/12.jpg" alt="Portofoliu 12"></div>
  <div class="item"><img src="portofolio/13.jpg" alt="Portofoliu 13"></div>
</div>
<script>
  var AUTO_SWITCH_SECONDS = 4;   // how often it switches by itself (0 = never)
  var HOVER_DELAY_MS = 180;      // mouse must rest this long on a picture before it opens

  var items = document.querySelectorAll('.gallery .item');
  var current = 1, paused = false, hoverTimer = null;
  function show(i) {
    for (var k = 0; k < items.length; k++) items[k].classList.remove('active');
    items[i].classList.add('active');
    current = i;
  }
  for (var k = 0; k < items.length; k++) {
    (function (i) {
      items[i].addEventListener('mouseenter', function () {
        paused = true;
        clearTimeout(hoverTimer);
        hoverTimer = setTimeout(function () { show(i); }, HOVER_DELAY_MS);
      });
      items[i].addEventListener('click', function () { show(i); });
    })(k);
  }
  document.getElementById('gallery').addEventListener('mouseleave', function () { clearTimeout(hoverTimer); paused = false; });
  if (AUTO_SWITCH_SECONDS > 0) {
    setInterval(function () {
      if (!paused) show((current + 1) % items.length);
    }, AUTO_SWITCH_SECONDS * 1000);
  }
</script>
</body>
</html>
