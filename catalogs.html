<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cataloage</title>
<style>
  html, body { margin: 0; background: transparent; }
  .grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;   /* centers a shorter last row */
    gap: 40px;
    padding: 10px;
  }
  .card {
    width: calc((100% - 120px) / 4);   /* 4 per row */
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    text-decoration: none;
    color: #222;
    background: #fff;
    border: 2px solid transparent;
    padding: 0 0 30px;
    transition: border-color 0.3s, transform 0.3s, box-shadow 0.3s;
  }
  .card img {
    width: 100%;
    aspect-ratio: 3 / 4;
    object-fit: cover;
    display: block;
    background: #eee;      /* grey shows if a cover can't load */
  }
  .card span {
    margin-top: 28px;
    text-align: center;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 22px;
    font-weight: bold;
    letter-spacing: 0.5px;
    transition: color 0.3s;
  }
  /* hover effect */
  .card:hover {
    border-color: #e8772e;     /* orange border on hover */
    transform: translateY(-4px);
    box-shadow: 0 10px 25px rgba(0,0,0,0.12);
  }
  .card:hover span { color: #e8772e; }   /* orange name on hover */

  @media (max-width: 900px) {
    .grid { gap: 20px; }
    .card { width: calc((100% - 20px) / 2); }   /* 2 per row on phones */
  }
  @media (max-width: 500px) { .card span { font-size: 17px; margin-top: 14px; } }
</style>
</head>
